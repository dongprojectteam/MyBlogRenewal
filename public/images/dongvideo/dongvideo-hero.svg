<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DongVideo screen previews</title>
  <desc id="desc">A visual collage of DongVideo Android video player screens including continue watching, fullscreen playback, subtitles, PIP, and widget controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B0C"/>
      <stop offset="0.45" stop-color="#151817"/>
      <stop offset="1" stop-color="#111015"/>
    </linearGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8C66A"/>
      <stop offset="0.46" stop-color="#75D6B2"/>
      <stop offset="1" stop-color="#7DB7FF"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8E72"/>
      <stop offset="0.54" stop-color="#C7A2FF"/>
      <stop offset="1" stop-color="#75D6B2"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

